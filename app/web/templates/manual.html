{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Manual Queue</h1>
    <p class="text-muted">All-day review desk — drafts waiting for human action</p>
</div>

{% if drafts %}
<div class="draft-list">
    {% for draft in drafts %}
    {% include "partials/manual_card.html" %}
    {% endfor %}
</div>
{% else %}
<div class="empty-state">
    <p class="text-muted">No drafts waiting for review.</p>
</div>
{% endif %}
{% endblock %}
